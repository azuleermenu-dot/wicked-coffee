name: Deploy Wicked Coffee to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download full cinematic source
        run: |
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_38JmUnMaaRRtQLkv4cn1Bj0fDuh/01bbb087-7999-4e38-abc3-0065990979e2.zip" -o wicked-coffee-source.zip
          rm -rf app
          unzip -oq wicked-coffee-source.zip
          test -f app/package.json
          test -f app/vite.config.ts
          test -d app/public/assets/world

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install

      - name: Build and prerender cinematic site
        working-directory: app
        run: bun run build

      - name: Verify static output
        run: |
          test -f app/dist/client/index.html
          test -d app/dist/client/assets
          test -d app/dist/client/assets/world
          touch app/dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload cinematic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/client

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
